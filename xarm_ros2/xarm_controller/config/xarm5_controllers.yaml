controller_manager:
  ros__parameters:
    update_rate: 100  # Start with lower rate for debugging

    # xarm5_traj_controller:
    #   type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    
    xarm5_cartesian_motion_controller:
      type: cartesian_motion_controller/CartesianMotionController

xarm5_traj_controller:
  ros__parameters:
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
    constraints:
      goal_time: 0.5
      stopped_velocity_tolerance: 0.0
      joint1: {trajectory: 1.0, goal: 0.01}
      joint2: {trajectory: 1.0, goal: 0.01}
      joint3: {trajectory: 1.0, goal: 0.01}
      joint4: {trajectory: 1.0, goal: 0.01}
      joint5: {trajectory: 1.0, goal: 0.01}
    interface_name: position
    state_publish_rate: 25.0
    action_monitor_rate: 10.0


xarm5_cartesian_motion_controller:
  ros__parameters:
    end_effector_link: "link5"
    robot_base_link: "link_base"
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5

    # Choose: position or velocity.
    command_interfaces:
      - position
        #- velocity

    solver:
        error_scale: 1.0
        iterations: 10

    pd_gains:
        trans_x: {p: 0.5}
        trans_y: {p: 0.5}
        trans_z: {p: 0.5}
        rot_x: {p: 0.5}
        rot_y: {p: 0.5}
        rot_z: {p: 0.5}
