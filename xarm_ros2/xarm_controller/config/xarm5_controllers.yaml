controller_manager:
  ros__parameters:
    update_rate: 150  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    xarm5_traj_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    xarm5_crisp_cartesian_impedance_controller:
      type: crisp_controllers/CartesianController

xarm5_traj_controller:
  ros__parameters:
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
    constraints:
      goal_time: 0.5
      stopped_velocity_tolerance: 0.0
      joint1: {trajectory: 1.0, goal: 0.01}
      joint2: {trajectory: 1.0, goal: 0.01}
      joint3: {trajectory: 1.0, goal: 0.01}
      joint4: {trajectory: 1.0, goal: 0.01}
      joint5: {trajectory: 1.0, goal: 0.01}
    interface_name: position
    state_publish_rate: 25.0
    action_monitor_rate: 10.0

xarm5_crisp_cartesian_impedance_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5

    end_effector_frame: link_tcp
    base_frame: base_link

    task:
      k_pos_x: 300.0
      k_pos_y: 300.0
      k_pos_z: 300.0
      k_rot_x: 30.0
      k_rot_y: 30.0
      k_rot_z: 30.0

    filter:
      q: 0.5
      dq: 0.5
      output_torque: 0.5

    nullspace:
      stiffness: 2.0

    use_friction: false
    use_coriolis_compensation: true
    use_local_jacobian: true
