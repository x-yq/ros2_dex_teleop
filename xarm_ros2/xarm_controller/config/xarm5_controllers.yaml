controller_manager:
  ros__parameters:
    update_rate: 100  # Start with lower rate for debugging

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    xarm5_traj_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    
    xarm5_cartesian_motion_controller:
      type: cartesian_motion_controller/CartesianMotionController


xarm5_cartesian_motion_controller:
  ros__parameters:
    end_effector_link: "link5"
    robot_base_link: "link_base"
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5

    # Choose: position or velocity.
    command_interfaces:
      - position
        #- velocity

    solver:
        error_scale: 0.5
        iterations: 10

    pd_gains:
        trans_x: {p: 0.5, d: 0.5}
        trans_y: {p: 0.5, d: 0.5}
        trans_z: {p: 0.5, d: 0.5}
        rot_x: {p: 0.5, d: 0.5}
        rot_y: {p: 0.5, d: 0.5}
        rot_z: {p: 0.5, d: 0.5}
