services:

  teleop-system:
    build:
      context: ..
      dockerfile: docker/Dockerfile.sysManager
    container_name: teleop-system
    environment:
      - DISPLAY=0
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - CONTAINER_NAME=teleop-system
    network_mode: host
    ipc: host
    privileged: true
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_PTRACE
    working_dir: /root
    volumes:
      - /tmp/argus_socket:/tmp/argus_socket
      - /var/run/docker.sock:/var/run/docker.sock
      - /run/udev:/run/udev
      - /dev:/dev
    device_cgroup_rules:
      - 'c *:* rmw'
    command: >
      bash -c "source /opt/ros/humble/setup.bash && tail -f /dev/null"
    restart: on-failure

  teleop-components:
    build:
      context: ..
      dockerfile: docker/Dockerfile.components
    container_name: teleop-components
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - CONTAINER_NAME=teleop-components
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=${HOME}/.Xauthority
    network_mode: host
    ipc: host
    privileged: true
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_PTRACE
    working_dir: /root
    volumes:
      - /tmp/argus_socket:/tmp/argus_socket
      - /var/run/docker.sock:/var/run/docker.sock
      - /run/udev:/run/udev
      - /dev:/dev
      - ${HOME}/.Xauthority:${HOME}/.Xauthority
      - /tmp/.X11-unix/:/tmp/.X11-unix/
    device_cgroup_rules:
      - 'c *:* rmw'
    command: >
      bash -c "source /opt/ros/humble/setup.bash && tail -f /dev/null"
    restart: on-failure

  teleop-drivers:
    build:
      context: ..
      dockerfile: docker/Dockerfile.drivers
    container_name: teleop-drivers
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - CONTAINER_NAME=teleop-drivers
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=${HOME}/.Xauthority
    network_mode: host
    ipc: host
    privileged: true
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_PTRACE
    working_dir: /root
    volumes:
      - /tmp/argus_socket:/tmp/argus_socket
      - /var/run/docker.sock:/var/run/docker.sock
      - /run/udev:/run/udev
      - /dev:/dev
      - ${HOME}/.Xauthority:${HOME}/.Xauthority
      - /tmp/.X11-unix/:/tmp/.X11-unix/
    device_cgroup_rules:
      - 'c *:* rmw'
    command: >
      bash -c "source /opt/ros/humble/setup.bash && tail -f /dev/null"
    restart: on-failure

              #  ros2 launch teleop_launcher system_manager.launch.py ros_domain_id:=${ROS_DOMAIN_ID:-0}
              #  ros2 launch teleop_launcher component_nodes.launch.py ros_domain_id:=${ROS_DOMAIN_ID:-0}
              #  ros2 launch teleop_launcher driver_nodes.launch.py ros_domain_id:=${ROS_DOMAIN_ID:-0}


  simulator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.simulation
    network_mode: "host"
    ipc: "host"
    security_opt:
      - seccomp=unconfined
    privileged: true
    working_dir: /root
    stdin_open: true
    tty: true
    environment:
      - DISPLAY=${DISPLAY}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - CONTAINER_NAME=simulator
      - XAUTHORITY=${HOME}/.Xauthority
      - ROS_DISTRO=humble
      - ROBOT=xarm5
      - EEF=xarm
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # - .:/src
      - ${HOME}/.Xauthority:${HOME}/.Xauthority
      - /tmp/.X11-unix/:/tmp/.X11-unix/
      - /tmp/argus_socket:/tmp/argus_socket
      - /run/udev:/run/udev
      - /dev:/dev
    cap_add:
      - SYS_PTRACE
    devices:
      - /dev
    device_cgroup_rules:
      - 'c *:* rmw'
    command: ["bash", "-c", "source /opt/ros/humble/setup.bash && source /root/dev_ws/install/setup.bash && tail -f /dev/null"] # python3 /src/simulated_env_launcher.py"]


