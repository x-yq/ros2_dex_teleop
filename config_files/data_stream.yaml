topics:

  - id: right_hand_keypoint_raw # also topic name
    latency_test_target: True
    msg_type: component_interfaces/msg/RawHandKeypoint
    frame_id: vr # must be one of the frame ids defined in the calibration.yaml
    publisher: input_sensor_driver_vr  ## must be layer_cn_id
    subscribers: [input_control_data_processor] # could be multi subscribers
  
  - id: right_hand_keypoint_processed # also topic name
    latency_test_target: True
    msg_type: component_interfaces/msg/ProcessedHandKeypoint
    frame_id: vr # must be one of the frame ids defined in the calibration.yaml
    publisher: input_control_data_processor ## must be layer_cn_id
    subscribers: [motion_retarget, feedback_data_processor] # could be multi subscribers
  
  - id: robot_control_cmd
    latency_test_target: True
    msg_type: component_interfaces/msg/ControlCmd
    frame_id: xarm5_robot
    publisher: motion_retarget
    subscribers: [robot_driver]

  - id: gripper_control_cmd 
    latency_test_target: True
    msg_type: component_interfaces/msg/ControlCmd
    frame_id: xarm5_robot
    publisher: motion_retarget
    subscribers: [robot_driver]

  - id: robot_state
    latency_test_target: True
    msg_type: component_interfaces/msg/RobotState
    frame_id: xarm5_robot
    publisher: robot_driver
    subscribers: [motion_retarget]
  
  - id: gripper_state
    latency_test_target: True
    msg_type: component_interfaces/msg/RobotState
    frame_id: xarm5_robot
    publisher: robot_driver
    subscribers: [motion_retarget]

  - id: /sim_camera/camera/image_raw 
    latency_test_target: False
    msg_type: sensor_msgs/msg/Image
    frame_id: xarm5_robot
    publisher: sim_camera
    subscribers: [feedback_projector_driver]

  - id: handkeypoint_plot_2d
    latency_test_target: True
    msg_type: component_interfaces/msg/Hand2DPlotData
    frame_id: vr
    publisher: feedback_data_processor
    subscribers: [feedback_projector_driver]
