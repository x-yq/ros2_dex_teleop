platforms:
  - hardware_id: pi4-197 # hardware_id, must be a execution platform
    containers:
      - name: snesor_drivers
        dockerfile: ./docker/Dockerfile.base # e.g.
        nodes: # must be the layer_cn_id
          - data_collector
          - input_sensor_driver_rococo
          - input_control_data_processor
          - motion_retarget
          - robot_driver
          - feedback_sensor_driver_realsense
          - feedback_data_processor
          - feedback_projector_driver
        env:
          DISPLAY: 0 # optional
        network:
          ipc: host
          net: host
        permissions:
          privileged: true