# each layer-cn plugin setup
layer_cn_id: sensor_driver_oculus_0
pkg_name: input_device_driver

meta:
  description: "Capture and process camera sensor input"
  layer: driver
  type: [input_device, feedback_sensor] # input_device or feedback_sensor, could be both
  priority: 1
  ros2_domain_id: None # optional
  
# fallback plugin
default_plugin: oculus_driver

plugins:
  - id: oculus_driver
    class_path: my_pkg.sensor_drivers.OculusVRDetector
    priority: 1
    params: # for node with plugin initialization
      cam_ids: []
      freq: 60

  - id: oculus_bimanual_driver
    class_path: my_pkg.sensor_drivers.OculusVRTwoHandDetector
    priority: 2
    params:
      freq: 60
