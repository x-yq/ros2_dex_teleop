# each layer-cn plugin setup
layer_cn_id: feedback_sensor_driver_realsense ## must be node name
pkg_name: feedback_sensor_driver ## ros2 pkg name

meta:
  description: "Capture and process camera sensor input"
  layer: driver
  type: [feedback_sensor] # input_device or feedback_sensor, could be both
  priority: 1
  ros2_domain_id: None # optional
  
# fallback plugin
default_plugin: realsense_driver

plugins:
  - id: realsense_driver
    _target_: feedback_sensor_driver.feedback_sensor_driver.plugins.realsense_driver.RealsenseDriver
    priority: 1
    params: # for node with plugin initialization
      cam_ids: [0]
      width: 1280
      height: 720
      fps: 30
      fps_sim: 30
      rotation_angle: 0
      processing_preset: 1
      constants:
        VISUAL_RESCALE_FACTOR: 2
        VIZ_PORT_OFFSET: 500
        DEPTH_PORT_OFFSET: 1000

