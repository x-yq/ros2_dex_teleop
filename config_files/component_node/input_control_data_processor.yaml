# each layer-cn plugin setup
layer_cn_id: input_control_data_processor ## must be node name
pkg_name: input_data_processor ## ros2 pkg name

meta:
  description: "Process the input raw keypoint data"
  layer: algorithm
  type: [input_data] # input_data or feedback_data
  priority: 1
  ros2_domain_id: None # optional
  
# fallback plugin
default_plugin: rococo_handkeypoint_processor

plugins:
  - id: rococo_handkeypoint_processor
    _target_: input_data_processor.input_data_processor.plugins.mocap_data_processor.RococoHandKeypointProcessor
    priority: 1
    params: # for node with plugin initialization
      frequency: 1
      # simulate_latency: 100


