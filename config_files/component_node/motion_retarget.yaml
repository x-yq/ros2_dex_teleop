##/root/dev_ws/src/motion_retarget/motion_retarget/plugins/motion_retarget_ot.py: MotionRetargetOT

layer_cn_id: motion_retarget
pkg_name: motion_retarget

meta:
  description: "Retarget the input control data to motion cmd in robot space"
  layer: algorithm
  type: [motion_retarget]
  priority: 1
  ros2_domain_id: None # optional
  
# fallback plugin
default_plugin: motion_retarget_ot

plugins:
  - id: motion_retarget_ot
    priority: 1
    params: # for node with plugin initialization,
      freq: 120
      relative: true # TEST: true for cartesian, false for joint
      space: cartesian
      orientation_mode: euler
