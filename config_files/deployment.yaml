platforms:
  - hardware_id: ubuntu
    containers:
      - name: teleop-system
        node_count: 3

  - hardware_id: ubuntu
    containers:
      - name: teleop-components
        node_count: 8

  - hardware_id: ubuntu
    containers:
      - name: simulator
        simulator_name: gazebo
        robot: xarm5
        eef: xarm_gripper